version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel_dev_2026
      POSTGRES_DB: hotel_management
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hotel -d hotel_management']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hotel-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --requirepass hotel_redis_2026
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: hotel-pgadmin
    restart: unless-stopped
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hotel.local
      PGADMIN_DEFAULT_PASSWORD: admin_2026
    depends_on:
      - postgres
    profiles:
      - dev

volumes:
  pgdata:
