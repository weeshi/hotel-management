<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ — دليل إدارة وتشغيل نظام إدارة الفنادق</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap');

  :root {
    --gold: #C9A84C;
    --gold-light: #E8D48B;
    --gold-dark: #A8882E;
    --bg-primary: #0D0D12;
    --bg-secondary: #13131A;
    --bg-card: #1A1A24;
    --bg-card-hover: #22222E;
    --text-primary: #F0EDE8;
    --text-secondary: #A09C96;
    --text-muted: #6B6760;
    --border: #2A2A36;
    --border-gold: rgba(201, 168, 76, 0.3);
    --green: #2ECC71;
    --red: #E74C3C;
    --yellow: #F1C40F;
    --blue: #3498DB;
    --purple: #9B59B6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.7;
    min-height: 100vh;
  }

  .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

  /* ===== Header / Hero ===== */
  .hero {
    background: linear-gradient(180deg, #17171f 0%, var(--bg-primary) 100%);
    border-bottom: 1px solid var(--border);
    padding: 48px 0 40px;
    text-align: center;
  }
  .hero .badge {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 999px;
    background: rgba(201,168,76,0.12);
    color: var(--gold);
    font-size: 13px;
    font-weight: 600;
    border: 1px solid var(--border-gold);
    margin-bottom: 18px;
    letter-spacing: 0.3px;
  }
  .hero h1 {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 800;
    color: var(--text-primary);
    line-height: 1.3;
    margin-bottom: 10px;
  }
  .hero h1 span { color: var(--gold); }
  .hero p.sub {
    color: var(--text-secondary);
    font-size: 17px;
    max-width: 640px;
    margin: 0 auto;
    font-weight: 400;
  }

  /* ===== Search ===== */
  .search-wrap {
    max-width: 620px;
    margin: 28px auto 0;
    position: relative;
  }
  .search-wrap .icon {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 20px;
    pointer-events: none;
  }
  #searchInput {
    width: 100%;
    padding: 15px 52px 15px 18px;
    border-radius: 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-primary);
    font-family: 'Cairo', sans-serif;
    font-size: 16px;
    outline: none;
    transition: border-color .2s;
  }
  #searchInput:focus { border-color: var(--border-gold); box-shadow: 0 0 0 3px rgba(201,168,76,0.12); }
  #searchInput::placeholder { color: var(--text-muted); }
  #resultCount {
    display: block;
    margin-top: 10px;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* ===== Category filter chips ===== */
  .cats {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    padding: 24px 0 8px;
  }
  .chip {
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-family: 'Cairo', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    user-select: none;
  }
  .chip:hover { border-color: var(--border-gold); color: var(--text-primary); }
  .chip.active {
    background: var(--gold);
    color: #0D0D12;
    border-color: var(--gold);
  }

  /* ===== FAQ Accordion ===== */
  .faq-list { padding: 20px 0 60px; }
  .faq-section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 700;
    color: var(--gold);
    margin: 30px 0 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .faq-section-title .num {
    width: 30px; height: 30px;
    flex-shrink: 0;
    display: grid; place-items: center;
    background: rgba(201,168,76,0.12);
    border: 1px solid var(--border-gold);
    border-radius: 8px;
    font-size: 14px;
  }

  .faq-item {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color .2s;
  }
  .faq-item.open { border-color: var(--border-gold); }
  .faq-q {
    width: 100%;
    text-align: right;
    padding: 16px 18px;
    background: none;
    border: none;
    color: var(--text-primary);
    font-family: 'Cairo', sans-serif;
    font-size: 15.5px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .faq-q .q-text { display: flex; align-items: flex-start; gap: 10px; }
  .faq-q .q-text .qmark {
    color: var(--gold);
    font-weight: 800;
    flex-shrink: 0;
  }
  .faq-q .chev {
    flex-shrink: 0;
    color: var(--text-muted);
    transition: transform .25s;
    font-size: 14px;
  }
  .faq-item.open .chev { transform: rotate(180deg); color: var(--gold); }
  .faq-a {
    max-height: 0;
    overflow: hidden;
    transition: max-height .3s ease;
  }
  .faq-a-inner {
    padding: 0 18px 16px 18px;
    color: var(--text-secondary);
    font-size: 14.5px;
    border-top: 1px solid var(--border);
    margin: 0 18px;
    padding-right: 0;
    padding-left: 0;
    padding-bottom: 14px;
    padding-top: 14px;
  }
  .faq-a-inner p { margin-bottom: 8px; }
  .faq-a-inner p:last-child { margin-bottom: 0; }
  .faq-a-inner ul { padding-right: 20px; margin: 6px 0; }
  .faq-a-inner li { margin-bottom: 4px; }
  .faq-a-inner strong { color: var(--text-primary); }
  .faq-a-inner .gold { color: var(--gold); font-weight: 700; }
  .faq-a-inner .green { color: var(--green); font-weight: 700; }
  .faq-a-inner .blue { color: var(--blue); font-weight: 700; }
  .faq-a-inner .red { color: var(--red); font-weight: 700; }
  .faq-a-inner code {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 7px;
    font-size: 13px;
    color: var(--gold-light);
    direction: ltr;
    display: inline-block;
  }
  .tip {
    background: rgba(52,152,219,0.08);
    border-right: 3px solid var(--blue);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 8px;
    font-size: 13.5px;
  }
  .note {
    background: rgba(241,196,15,0.08);
    border-right: 3px solid var(--yellow);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 8px;
    font-size: 13.5px;
  }
  .warn {
    background: rgba(231,76,60,0.08);
    border-right: 3px solid var(--red);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 8px;
    font-size: 13.5px;
  }

  /* tags */
  .tags { padding: 8px 18px 14px 18px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .2s;
    border: 1px solid transparent;
  }
  .tag:hover { opacity: 0.8; }
  .tag-gold   { background: rgba(201,168,76,0.14);  color: var(--gold-light);  border-color: var(--border-gold); }
  .tag-green  { background: rgba(46,204,113,0.12);  color: #7fe3a8; }
  .tag-blue   { background: rgba(52,152,219,0.12);  color: #8ec4ea; }
  .tag-red    { background: rgba(231,76,60,0.12);   color: #f3968a; }
  .tag-purple { background: rgba(155,89,182,0.14);  color: #c7a1d9; }
  .tag.active-tag { outline: 2px solid var(--gold); outline-offset: 1px; }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-muted);
  }
  .empty-state .ico { font-size: 46px; margin-bottom: 14px; }

  /* Footer */
  footer {
    border-top: 1px solid var(--border);
    padding: 26px 0 40px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13.5px;
  }
  footer .roles { margin-top: 6px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold-dark); }

  .hidden-item { display: none !important; }
</style>
</head>
<body>

<div class="hero">
  <div class="container">
    <span class="badge">📘 دليل الاستخدام الشامل</span>
    <h1>الأسئلة الشائعة — <span>FAQ</span></h1>

    <div class="search-wrap">
      <span class="icon">🔍</span>

    </div>

    <div class="cats" id="cats">

      <button class="chip" data-cat="services">🛎️ الخدمات</button>

</div>

<div class="container">

</div>

<footer>
  <div class="container">
    <strong style="color: var(--gold);">نظام إدارة الفنادق</strong> — دليل الأسئلة الشائعة
    <div class="roles">الأدوار: مشرف النظام · مدير النظام · مدير · استقبال · تدبير منزلي · صيانة · مطعم · محاسب</div>
  </div>
</footer>

  /* ============ ⚙️ الإعدادات ============ */

  {

  },
  {

    q: 'ما هي سياسات الإلغاء وكيف أضبطها؟',

/* ============================================================
   منطق العرض والب﻿حث والوسوم
   ============================================================ */
const faqList = document.getElementById('faqList');
const searchInput = document.getElementById('searchInput');
const resultCount = document.getElementById('resultCount');

let activeCat = 'all';
let activeTag = null;
let searchText = '';

// إعادة بناء ثم تصفية
function render() {
  const filtered = FAQS.filter(faq => {
    // فلترة التصنيف
    if (activeCat !== 'all' && faq.cat !== activeCat) return false;
    // فلترة الوسم النشط
    if (activeTag && !faq.tags.includes(activeTag)) return false;
    // فلترة البحث
    if (searchText) {
      const hay = (faq.q + ' ' + faq.a.replace(/<[^>]+>/g, ' ') + ' ' + faq.tags.join(' ')).toLowerCase();
      if (!hay.includes(searchText)) return false;
    }
    return true;
  });

  // تجميع حسب التصنيف (مع الحفاظ على ترتيب الفئات)
  const order = ['settings','users','hotel','rooms','guests','bookings','services','payments','safes','wallet','reports'];
  const groups = {};
  filtered.forEach(f => {
    if (!groups[f.cat]) groups[f.cat] = [];
    groups[f.cat].push(f);
  });

  let html = '';
  if (filtered.length === 0) {
    html = '<div class="empty-state"><div class="ico">🤔</div><p>لا توجد نتائج مطابقة.<br>جرّب كلمة أخرى أو أزل عوامل التصفية.</p></div>';
  } else {
    order.forEach(cat => {
      const items = groups[cat];
      if (!items || items.length === 0) return;
      const num = order.indexOf(cat) + 1;
      html += `<div class="faq-section-title" data-cat="${cat}"><span class="num">${num}</span> ${CAT_ICON[cat]} ${CATEGORIES[cat].label}</div>`;
      items.forEach((faq, i) => {
        const tagHtml = faq.tags.map(t => {
          const color = tagColor(t);
          return `<span class="tag tag-${color}${activeTag === t ? ' active-tag' : ''}" data-tag="${t}">${t}</span>`;
        }).join('');
        html += `
          <div class="faq-item" data-key="${cat}-${i}">
            <button class="faq-q" onclick="toggle(this)">
              <span class="q-text"><span class="qmark">؟</span><span>${faq.q}</span></span>
              <span class="chev">▼</span>
            </button>
            <div class="faq-a"><div class="faq-a-inner">${faq.a}</div></div>
            <div class="tags">${tagHtml}</div>
          </div>`;
      });
    });
  }

  faqList.innerHTML = html;
  resultCount.textContent = filtered.length
    ? `عدد النتائج المعروضة: ${filtered.length}`
    : '';

  // ربط نقرات الوسوم
  faqList.querySelectorAll('.tag').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const t = el.dataset.tag;
      activeTag = (activeTag === t) ? null : t;
      // تصفية يجب أن تنسحب على كل الأقسام
      render();
    });
  });
}

function tagColor(t) {
  const gold = ['إعدادات','بيانات الفندق','فندق','أسعار','حجز','الفندق','المحفظة','إيداع','سحب','رصيد'];
  const green = ['دفع','إيصال','استرداد','فتح','إضافة','إنشاء','نزيل','تسجيل'];
  const red = ['إلغاء','تعطيل','إيقاف','حظر','فشل','تخلص','المفقودات'];
  const purple = ['مطعم','دعوات','invitations','SaaS'];
  const ln = t.toLowerCase();
  if (red.includes(ln)) return 'red';
  if (purple.includes(ln)) return 'purple';
  if (green.includes(ln)) return 'green';
  if (gold.includes(ln)) return 'gold';
  return 'blue';
}

function toggle(btn) {
  const item = btn.closest('.faq-item');
  const wasOpen = item.classList.contains('open');
  // إغلاق الكل (أكورديون)
  document.querySelectorAll('.faq-item.open').forEach(i => {
    i.classList.remove('open');
    i.querySelector('.faq-a').style.maxHeight = '0px';
  });
  if (!wasOpen) {
    item.classList.add('open');
    const answer = item.querySelector('.faq-a');
    answer.style.maxHeight = answer.scrollHeight + 60 + 'px';
  }
}

/* أحداث البحث */
searchInput.addEventListener('input', e => {
  searchText = e.target.value.trim().toLowerCase();
  render();
});

/* أزرار التصنيف */
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    activeCat = chip.dataset.cat;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    render();
    window.scrollTo({ top: document.querySelector('.search-wrap').getBoundingClientRect().top + window.scrollY - 20, behavior: 'smooth' });
  });
});

/* العرض الأول */
render();
</script>
